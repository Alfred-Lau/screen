name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" — setting it here too is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        # Advisory only: a new upstream advisory should not turn a contributor's PR red.
        continue-on-error: true
        run: pnpm audit --prod

      - name: Build registry
        run: pnpm registry:build

      - name: Demo build
        run: pnpm demo:build
